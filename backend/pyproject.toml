[project]
name = "doc-unify-backend"
version = "0.1.0"
description = "Ingestion, schema discovery, extraction, and chat-agent backend for doc-unify."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy[asyncio]>=2.0",
    "psycopg[binary]>=3.2",
    "pgvector>=0.3",
    "alembic>=1.14",
    "httpx>=0.27",
    "pdfplumber>=0.11",
    "pymupdf>=1.24",
    "pytesseract>=0.3.13",
    "pillow>=10.4",
    "python-docx>=1.1",
    "python-pptx>=1.0",
    "python-multipart>=0.0.12",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["migrations"]

[tool.ruff.lint.per-file-ignores]
"app/api/*.py" = ["B008"]  # FastAPI's Depends(...)-in-default is the idiom.

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
