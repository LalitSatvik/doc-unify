services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: docunify
      POSTGRES_PASSWORD: docunify
      POSTGRES_DB: docunify
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U docunify"]
      interval: 5s
      timeout: 5s
      retries: 10

  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama-data:/root/.ollama

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://docunify:docunify@postgres:5432/docunify
      LLM_PROVIDER: ollama
      OLLAMA_BASE_URL: http://ollama:11434
    ports:
      - "8000:8000"
    volumes:
      - ./backend/app:/app/app
      - ./backend/tests:/app/tests
    depends_on:
      postgres:
        condition: service_healthy
      ollama:
        condition: service_started

  frontend:
    build: ./frontend
    environment:
      BACKEND_URL: http://backend:8000
    ports:
      - "3000:3000"
    volumes:
      - ./frontend/app:/app/app
    depends_on:
      - backend

volumes:
  postgres-data:
  ollama-data:
